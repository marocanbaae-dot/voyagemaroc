    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { ...DEFAULT_STATE };
        return { ...DEFAULT_STATE, ...JSON.parse(raw) };
      } catch (e) {
        console.warn('LocalStorage unavailable, using session memory.', e);
        return { ...DEFAULT_STATE };
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.warn('Could not persist state.', e);
      }
      updateHUD();
    }

    function addXP(amount, reason = '') {
      state.xp += amount;
      saveState();
      showToast(`+${amount} XP ${reason ? '— ' + reason : ''}`, 'xp');
    }

    function unlockBadge(badgeId) {
      if (!state.badges.includes(badgeId)) {
        state.badges.push(badgeId);
        saveState();
        const b = BADGES.find(x => x.id === badgeId);
        if (b) {
          showToast(`🏆 Nouveau badge débloqué : ${b.name} !`, 'badge');
        }
      }
    }

    function recordMistake(vocabId) {
      if (vocabId && !state.mistakes.includes(vocabId)) {
        state.mistakes.push(vocabId);
        saveState();
      }
    }

    function markMastered(vocabId) {
      if (!vocabId) return;
      state.mistakes = state.mistakes.filter(id => id !== vocabId);
      if (!state.masteredVocab.includes(vocabId)) {
        state.masteredVocab.push(vocabId);
      }
      saveState();
    }

    function getAllVocab() {
      return UNITS.flatMap(u => u.vocab.map(v => ({ ...v, unitId: u.id, unitTitle: u.titleDarija })));
    }

    function getLevelTitle(xp) {
      if (xp >= 450) return '👑 As de la Darija';
      if (xp >= 280) return '🚀 Champion du Maroc';
      if (xp >= 120) return '🧭 Voyageur Curieux';
      return '🌱 Explorateur';
    }

    function updateHUD() {
      document.getElementById('hud-xp').textContent = `${state.xp} XP`;
      document.getElementById('hud-level').textContent = getLevelTitle(state.xp);

      const totalMilestones = UNITS.length + 1; // 6 units + Final Adventure
      const done = state.completedUnits.length + (state.finalBestScore !== null ? 1 : 0);
      const pct = Math.min(100, Math.round((done / totalMilestones) * 100));

      document.getElementById('global-progress-bar').style.width = `${pct}%`;
      document.getElementById('global-progress-text').textContent = `${pct}% complété`;

      // Mistakes counter badge
      const mBadge = document.getElementById('mistakes-badge');
      if (state.mistakes.length > 0) {
        mBadge.textContent = state.mistakes.length;
        mBadge.classList.remove('hidden');
      } else {
        mBadge.classList.add('hidden');
      }

      // Active nav highlighting
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('bg-teal-700', 'text-white', 'shadow-sm');
        btn.classList.add('text-slate-600', 'hover:bg-slate-100');
      });
      const activeNav = document.getElementById(`nav-${currentView === 'unit' ? 'home' : currentView}`);
      if (activeNav) {
        activeNav.classList.remove('text-slate-600', 'hover:bg-slate-100');
        activeNav.classList.add('bg-teal-700', 'text-white', 'shadow-sm');
      }
    }

    /* =========================================================================
       3. AUDIO ENGINE (Web Speech API + Native Audio Ready + Transparent Note)
       ========================================================================= */
    function speakDarija(text, arabicText = '', audioFile = '') {
      // 1. Future-proof hook for native Moroccan audio recordings
      if (audioFile) {
        const audio = new Audio(audioFile);
        audio.play().catch(() => fallbackTTS(text, arabicText));
        return;
      }
      fallbackTTS(text, arabicText);
    }

    function fallbackTTS(text, arabicText) {
      if (!('speechSynthesis' in window)) {
        showToast('Audio non supporté par ce navigateur. Lis la transcription phonétique !', 'info');
        return;
      }
      window.speechSynthesis.cancel();
      const voices = window.speechSynthesis.getVoices();
      const arVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('ar'));

      const utter = new SpeechSynthesisUtterance(arVoice && arabicText ? arabicText : text.replace(/3/g, 'a').replace(/7/g, 'h').replace(/9/g, 'k'));
      utter.lang = arVoice ? arVoice.lang : 'fr-FR';
      if (arVoice) utter.voice = arVoice;
      utter.rate = 0.88;
      window.speechSynthesis.speak(utter);
    }

    /* =========================================================================
       5. NAVIGATION & VIEW ROUTING
       ========================================================================= */
    function navigateTo(view, unitId = null) {
      stopRecordingIfActive();
      currentView = view;
      if (unitId !== null) {
        activeUnitId = unitId;
        state.lastUnitId = unitId;
        activeUnitTab = 'scene';
        saveState();
      }
      updateHUD();
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderApp() {
      const root = document.getElementById('app-root');
      if (currentView === 'home') {
        root.innerHTML = renderHomeView();
      } else if (currentView === 'unit') {
        root.innerHTML = renderUnitView(activeUnitId);
      } else if (currentView === 'review') {
        root.innerHTML = renderReviewView();
      } else if (currentView === 'badges') {
        root.innerHTML = renderBadgesView();
      } else if (currentView === 'final') {
        root.innerHTML = renderFinalAdventureView();
      }
    }

    /* --- TAB 3: INTERACTIVE DIALOGUE --- */

    function toggleDialogueFr() {

    function selectDialogueOption(unitId, lineIdx, optIdx) {

      const unit = UNITS.find(u => u.id === unitId);
      const opt = unit.dialogue[lineIdx].options[optIdx];
      const alreadyAnswered = dialogueSelections[key] !== undefined;
      dialogueSelections[key] = optIdx;
      if (!alreadyAnswered && opt.correct) {

    /* --- TAB 4: COMPREHENSION & QUIZ --- */
    function renderUnitQuiz(unit) {

          </div>

              return `
                <div class="border border-slate-200 rounded-2xl p-4 sm:p-5 bg-slate-50/60 space-y-3">
                  <div class="font-display font-extrabold text-sm sm:text-base text-slate-900">

      const unit = UNITS.find(u => u.id === unitId);

    /* --- TAB 5: SENTENCE BUILDER (TAP CHIPS TO ORDER) --- */
    function initBuilderIfNeeded(unitId, bIdx, item) {
      const key = `${unitId}_b_${bIdx}`;
      if (!builderState[key]) {
        const pool = [...item.words, ...item.distractors].sort(() => Math.random() - 0.5);
        builderState[key] = { pool, selected: [], checked: false, isCorrect: false };
      }
      return builderState[key];
    }

    function renderUnitBuilder(unit) {
      return `
        <div class="space-y-6 fade-in">
          <div>
            <h2 class="font-display font-black text-xl text-slate-900">🧩 Atelier : Construis la phrase !</h2>
            <p class="text-xs sm:text-sm text-slate-500">Clique sur les mots dans le bon ordre (attention aux mots pièges !).</p>
          </div>

          <div class="space-y-5">
            ${unit.builder.map((item, bIdx) => {
              const st = initBuilderIfNeeded(unit.id, bIdx, item);
              return `
                <div class="border border-slate-200 rounded-2xl p-4 sm:p-5 bg-slate-50/70 space-y-3.5">
                  <div class="font-display font-extrabold text-sm sm:text-base text-slate-900">
                    ${bIdx + 1}. ${item.promptFr}
                  </div>

                  <!-- Drop / Selected Zone -->
                  <div class="min-h-[54px] bg-white border-2 border-dashed ${st.checked ? (st.isCorrect ? 'border-emerald-400 bg-emerald-50/50' : 'border-rose-400 bg-rose-50/50') : 'border-teal-300'} rounded-xl p-2.5 flex flex-wrap gap-2 items-center">
                    ${st.selected.length === 0 ? `<span class="text-xs text-slate-400 italic">Clique sur les mots ci-dessous…</span>` : ''}

                      <button onclick="removeBuilderWord(${unit.id}, ${bIdx}, ${pos})" class="px-3 py-1.5 rounded-xl bg-teal-700 text-white font-display font-bold text-sm shadow-sm hover:bg-teal-600 transition">
                        ${st.pool[wordIdx]}
                      </button>
                    `).join('')}
                  </div>

                  <!-- Available Words Pool -->
                  <div class="flex flex-wrap gap-2">
                    ${st.pool.map((word, wIdx) => {
                      const used = st.selected.includes(wIdx);
                      return `
                        <button onclick="addBuilderWord(${unit.id}, ${bIdx}, ${wIdx})" ${used ? 'disabled' : ''} class="px-3.5 py-2 rounded-xl border-2 font-display font-bold text-sm transition ${
                          used
                            ? 'bg-slate-100 border-slate-200 text-slate-300 cursor-not-allowed'
                            : 'bg-white border-slate-300 hover:border-teal-500 text-slate-800 shadow-sm'
                        }">
                          ${word}

                    }).join('')}

                    <button onclick="checkBuilder(${unit.id}, ${bIdx})" class="btn-3d bg-amber-500 hover:bg-amber-400 text-white text-xs font-black px-4 py-2 rounded-xl">
                      Vérifier ✓
                    </button>
                    <button onclick="resetBuilder(${unit.id}, ${bIdx})" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold px-3 py-2 rounded-xl">
                      Effacer
                    </button>
                    ${st.checked ? `
                      <span class="text-xs font-bold ${st.isCorrect ? 'text-emerald-700' : 'text-rose-700'}">
                        ${st.isCorrect ? '🎉 Exact ! Super phrase !' : `❌ Essaie encore ! Réponse : ${item.words.join(' ')}`}

                </div>
              `;
            }).join('')}

          <div class="flex justify-between pt-2">
            <button onclick="setUnitTab('quiz')" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-bold">← Quiz</button>
            <button onclick="setUnitTab('roleplay')" class="btn-3d bg-teal-700 hover:bg-teal-600 text-white font-display font-black px-6 py-3 rounded-2xl text-sm sm:text-base">
              Mission Orale 🎤 →
            </button>
          </div>
        </div>
      `;
    }

    function addBuilderWord(unitId, bIdx, wIdx) {
      const st = builderState[`${unitId}_b_${bIdx}`];
      if (!st || st.selected.includes(wIdx)) return;
      st.selected.push(wIdx);
      st.checked = false;
      renderApp();
    }

    function removeBuilderWord(unitId, bIdx, pos) {
      const st = builderState[`${unitId}_b_${bIdx}`];
      if (!st) return;
      st.selected.splice(pos, 1);
      st.checked = false;
      renderApp();
    }

    function resetBuilder(unitId, bIdx) {
      const st = builderState[`${unitId}_b_${bIdx}`];
      if (!st) return;
      st.selected = [];
      st.checked = false;
      renderApp();
    }

    function checkBuilder(unitId, bIdx) {
      const unit = UNITS.find(u => u.id === unitId);
      const item = unit.builder[bIdx];
      const st = builderState[`${unitId}_b_${bIdx}`];
      const built = st.selected.map(i => st.pool[i]).join(' ');
      const target = item.words.join(' ');
      const wasCorrect = st.isCorrect;

      st.checked = true;
      st.isCorrect = built === target;

      if (st.isCorrect && !wasCorrect) {
        addXP(15, 'Phrase bien construite !');
        markMastered(item.vocabId);
      } else if (!st.isCorrect) {
        recordMistake(item.vocabId);
      }
      renderApp();
    }

    /* --- TAB 6: ROLE-PLAY, FREE PRODUCTION & VOICE RECORDER --- */
    function renderUnitRoleplay(unit) {
      const rp = unit.roleplay;
      const evalRes = roleplayEvaluations[unit.id];

      return `
        <div class="space-y-5 fade-in">

            </div>
            <p class="font-display font-extrabold text-lg sm:text-xl leading-snug">« ${rp.characterLineDarija} »</p>
            <p class="text-xs sm:text-sm text-slate-300 italic">${rp.characterLineFr}</p>
          </div>

          <!-- Mission Instructions -->
          <div class="bg-teal-50 border border-teal-200 rounded-2xl p-4">
            <div class="text-xs font-black uppercase text-teal-800 mb-1">🎯 Ta mission :</div>
            <p class="text-sm text-teal-950 font-semibold">${rp.missionFr}</p>
          </div>

          <!-- Free Written Production Box -->
          <div class="space-y-2.5">
            <label for="rp-input-${unit.id}" class="block text-xs font-extrabold uppercase text-slate-600">
              1. Écris ta réponse en Darija (sans traducteur !) :
            </label>
            <textarea id="rp-input-${unit.id}" rows="2" placeholder="Ex : Salam..." class="w-full rounded-2xl border-2 border-slate-200 focus:border-teal-500 focus:outline-none p-3.5 text-sm sm:text-base font-medium">${evalRes ? evalRes.userText : ''}</textarea>
            <div class="flex flex-wrap gap-2">
              <button onclick="evaluateRoleplay(${unit.id})" class="btn-3d bg-teal-700 hover:bg-teal-600 text-white text-xs sm:text-sm font-black px-5 py-2.5 rounded-xl">
                Valider ma réponse ✓
              </button>
              <button onclick="revealRoleplayModel(${unit.id})" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs sm:text-sm font-bold px-4 py-2.5 rounded-xl">
                💡 Voir un exemple naturel
              </button>
            </div>
          </div>

          ${evalRes ? `
            <div class="rounded-2xl p-4 border-2 ${evalRes.passed ? 'bg-emerald-50 border-emerald-300' : 'bg-amber-50 border-amber-300'} space-y-2 pop-in">
              <div class="font-display font-black text-sm ${evalRes.passed ? 'text-emerald-900' : 'text-amber-900'}">
                ${evalRes.feedback}
              </div>
              <div class="bg-white/90 rounded-xl p-3 text-xs sm:text-sm border border-slate-200">
                <div class="font-bold text-slate-500 text-[11px] uppercase">Exemple 100% naturel :</div>
                <div class="font-display font-extrabold text-teal-900 mt-0.5">${rp.modelDarija}</div>
                <div class="text-slate-600 text-xs">${rp.modelFr}</div>
              </div>
            </div>
          ` : ''}

          <!-- Real Voice Recorder for Speaking Practice -->
          <div class="border border-slate-200 rounded-2xl p-4 bg-slate-50 space-y-3">
            <div class="flex items-center justify-between flex-wrap gap-2">
              <div>
                <div class="text-xs font-black uppercase text-slate-700">2. Entraînement Oral (Enregistre ta voix !)</div>
                <p class="text-xs text-slate-500">Parle à voix haute et réécoute-toi pour gagner confiance (aucune note automatique artificielle).</p>
              </div>
              <button id="rec-btn" onclick="toggleVoiceRecording()" class="btn-3d px-4 py-2.5 rounded-xl text-xs font-black text-white flex items-center gap-2 ${isRecording ? 'bg-rose-600 recording-pulse' : 'bg-slate-800 hover:bg-slate-700'}">
                <span>${isRecording ? '⏹️ Arrêter' : '🎙️ S’enregistrer'}</span>

            <button onclick="completeUnit(${unit.id})" class="btn-3d bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-display font-black px-6 py-3.5 rounded-2xl text-sm sm:text-base">

            </button>

    function evaluateRoleplay(unitId) {
      const unit = UNITS.find(u => u.id === unitId);
      const inputEl = document.getElementById(`rp-input-${unitId}`);
      const text = (inputEl ? inputEl.value : '').trim();
      if (!text) {
        showToast('Écris d’abord une petite phrase en Darija !', 'info');
        return;
      }

      const norm = text.toLowerCase();
      const matches = unit.roleplay.expectedKeywords.filter(k => norm.includes(k));
      const passed = matches.length >= 1 && text.length >= 5;

      const wasPassed = roleplayEvaluations[unitId]?.passed;
      roleplayEvaluations[unitId] = {
        userText: text,
        passed,
        feedback: passed
          ? '🔥 Tbarkellah 3lik ! Ta réponse est compréhensible et adaptée à la situation !'
          : '👍 Bel effort ! Essaie d’ajouter un mot-clé de cette étape (regarde l’exemple ci-dessous) et réessaie !'
      };

      if (passed && !wasPassed) {
        addXP(25, 'Mission orale réussie !');
      }
      renderApp();
    }

    function revealRoleplayModel(unitId) {
      const inputEl = document.getElementById(`rp-input-${unitId}`);
      roleplayEvaluations[unitId] = {
        userText: inputEl ? inputEl.value : '',
        passed: false,
        feedback: '💡 Voici un modèle naturel. Lis-le à voix haute puis essaie d’écrire ta propre version !'
      };
      renderApp();
    }

    async function toggleVoiceRecording() {
      if (isRecording) {
        stopRecordingIfActive();
        renderApp();
        return;
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showToast('Le micro n’est pas disponible sur ce navigateur. Entraîne-toi quand même à voix haute !', 'info');
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = e => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'audio/webm' });
          recordedAudioUrl = URL.createObjectURL(blob);
          stream.getTracks().forEach(t => t.stop());
          isRecording = false;
          addXP(10, 'Bravo d’avoir parlé à voix haute !');
          renderApp();
        };
        mediaRecorder.start();
        isRecording = true;
        renderApp();
      } catch (err) {
        showToast('Accès au micro refusé ou indisponible. Tu peux continuer en lisant à voix haute !', 'info');
      }
    }

    function stopRecordingIfActive() {
      if (mediaRecorder && isRecording) {
        try { mediaRecorder.stop(); } catch (e) {}
      }
      isRecording = false;
    }

    function completeUnit(unitId) {
      const unit = UNITS.find(u => u.id === unitId);
      const isNew = !state.completedUnits.includes(unitId);
      if (isNew) {
        state.completedUnits.push(unitId);
        addXP(40, `Étape ${unitId} terminée !`);
      }
      unlockBadge(unit.badgeId);
      unit.vocab.forEach(v => {
        if (!state.mistakes.includes(v.id)) markMastered(v.id);
      });
      saveState();

      const nextUnit = UNITS.find(u => u.id === unitId + 1);
      const nextAction = nextUnit
        ? { label: `Étape suivante : ${nextUnit.titleDarija} →`, fn: () => { closeModal(); navigateTo('unit', nextUnit.id); } }
        : { label: '🎯 Lancer le Défi Final !', fn: () => { closeModal(); navigateTo('final'); } };

      openModal(
        unit.badgeIcon,
        `Bravo ! Étape ${unitId} réussie !`,
        `Tbarkellah 3lik ! Tu as débloqué le badge « ${unit.badgeName} ». Tu es prêt pour la suite de ton aventure au Maroc !`,
        [
          { label: 'Carte', secondary: true, fn: () => { closeModal(); navigateTo('home'); } },
          nextAction
        ]
      );
    }

    /* =========================================================================
       8. VIEW 3: SPACED REPETITION & ACTIVE RECALL REVIEW
       ========================================================================= */
    function startReviewSession(mode = 'smart') {
      reviewMode = mode;
      const all = getAllVocab();
      if (mode === 'smart' && state.mistakes.length > 0) {
        reviewDeck = all.filter(v => state.mistakes.includes(v.id));
      } else if (mode === 'm1') {
        reviewDeck = all.filter(v => v.unitId <= 2).sort(() => Math.random() - 0.5).slice(0, 10);
      } else if (mode === 'm2') {
        reviewDeck = all.filter(v => v.unitId === 3 || v.unitId === 4).sort(() => Math.random() - 0.5).slice(0, 10);
      } else {
        reviewDeck = all.sort(() => Math.random() - 0.5).slice(0, 12);
      }
      reviewIndex = 0;
      reviewRevealed = false;
      navigateTo('review');
    }

    function renderReviewView() {
      if (reviewDeck.length === 0) {
        const all = getAllVocab();
        reviewDeck = state.mistakes.length > 0
          ? all.filter(v => state.mistakes.includes(v.id))
          : all.sort(() => Math.random() - 0.5).slice(0, 10);
        reviewIndex = 0;
        reviewRevealed = false;
      }

      const card = reviewDeck[reviewIndex];

      return `
        <div class="fade-in max-w-2xl mx-auto space-y-5">
          <div class="text-center space-y-1">
            <h1 class="font-display font-black text-2xl sm:text-3xl text-slate-900">🧠 Révision Active (Sans tricher !)</h1>
            <p class="text-xs sm:text-sm text-slate-500">Essaie de dire la phrase en Darija dans ta tête avant de révéler la réponse.</p>
          </div>

          <!-- Mode Selector -->
          <div class="flex flex-wrap justify-center gap-2">
            <button onclick="startReviewSession('smart')" class="px-3.5 py-2 rounded-xl text-xs font-extrabold ${reviewMode === 'smart' ? 'bg-rose-600 text-white' : 'bg-white border border-slate-200 text-slate-700'}">
              🎯 Mes erreurs (${state.mistakes.length})
            </button>
            <button onclick="startReviewSession('m1')" class="px-3.5 py-2 rounded-xl text-xs font-extrabold ${reviewMode === 'm1' ? 'bg-teal-700 text-white' : 'bg-white border border-slate-200 text-slate-700'}">
              Étapes 1 &amp; 2
            </button>
            <button onclick="startReviewSession('m2')" class="px-3.5 py-2 rounded-xl text-xs font-extrabold ${reviewMode === 'm2' ? 'bg-teal-700 text-white' : 'bg-white border border-slate-200 text-slate-700'}">
              Étapes 3 &amp; 4
            </button>
            <button onclick="startReviewSession('all')" class="px-3.5 py-2 rounded-xl text-xs font-extrabold ${reviewMode === 'all' ? 'bg-amber-500 text-white' : 'bg-white border border-slate-200 text-slate-700'}">
              🎲 Mix Général
            </button>
          </div>

          ${card ? `
            <!-- Active Recall Flashcard -->
            <div class="bg-white rounded-3xl border-2 border-slate-200 p-6 sm:p-8 shadow-md text-center space-y-5">
              <div class="flex items-center justify-between text-xs font-bold text-slate-400">
                <span>Carte ${reviewIndex + 1} / ${reviewDeck.length}</span>
                <span class="bg-slate-100 text-slate-600 px-2.5 py-0.5 rounded-full">Étape ${card.unitId}</span>
              </div>

              <div class="py-4 space-y-2">
                <div class="text-5xl mb-2">${card.icon}</div>
                <div class="text-xs font-bold uppercase tracking-wider text-slate-400">Comment dit-on en Darija :</div>
                <div class="font-display font-black text-2xl sm:text-3xl text-slate-900">${card.fr}</div>
              </div>

              ${!reviewRevealed ? `
                <button onclick="revealReviewCard()" class="btn-3d bg-teal-700 hover:bg-teal-600 text-white font-display font-black px-8 py-3.5 rounded-2xl text-base w-full sm:w-auto">
                  👁️ Voir la réponse
                </button>
              ` : `
                <div class="bg-teal-50 border-2 border-teal-200 rounded-2xl p-5 space-y-2 pop-in">
                  <div class="flex items-center justify-center gap-3">
                    <span class="font-display font-black text-2xl sm:text-3xl text-teal-900">${card.darija}</span>
                    <button onclick="speakDarija('${escapeQuotes(card.darija)}', '${escapeQuotes(card.arabic)}')" class="w-9 h-9 rounded-xl bg-white border border-teal-200 flex items-center justify-center">🔊</button>
                  </div>
                  ${state.showArabic ? `<div class="text-base text-slate-500" dir="rtl">${card.arabic}</div>` : ''}
                  <p class="text-xs text-slate-600">${card.context}</p>
                </div>

                <div class="grid grid-cols-2 gap-3 pt-2">
                  <button onclick="rateReviewCard(false)" class="btn-3d bg-rose-100 hover:bg-rose-200 text-rose-800 font-display font-extrabold py-3 rounded-2xl text-sm">
                    😅 À revoir encore
                  </button>
                  <button onclick="rateReviewCard(true)" class="btn-3d bg-emerald-600 hover:bg-emerald-500 text-white font-display font-extrabold py-3 rounded-2xl text-sm">
                    ✅ Je connais !
                  </button>
                </div>
              `}
            </div>
          ` : `
            <div class="bg-white rounded-3xl border border-slate-200 p-8 text-center space-y-4">
              <div class="text-5xl">🎉</div>
              <h2 class="font-display font-black text-2xl text-slate-900">Session de révision terminée !</h2>
              <p class="text-sm text-slate-600">Ta mémoire devient de plus en plus forte en Darija !</p>
              <button onclick="startReviewSession('all')" class="btn-3d bg-teal-700 text-white font-display font-black px-6 py-3 rounded-2xl text-sm">
                Nouvelle série 🎲
              </button>
            </div>
          `}
        </div>
      `;
    }

    function revealReviewCard() {
      reviewRevealed = true;
      renderApp();
    }

    function rateReviewCard(knewIt) {
      const card = reviewDeck[reviewIndex];
      if (knewIt) {
        markMastered(card.id);
        addXP(5);
      } else {
        recordMistake(card.id);
      }

      reviewIndex++;
      reviewRevealed = false;

      if (reviewIndex >= reviewDeck.length) {
        unlockBadge('badge_reviewer');
        reviewDeck = [];
      }
      renderApp();
    }

    /* =========================================================================
       9. VIEW 4: BADGES & PROGRESS DASHBOARD
       ========================================================================= */
    function renderBadgesView() {
      return `
        <div class="fade-in space-y-6">
          <div class="bg-white rounded-3xl border border-slate-200 p-6 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-sm">
            <div>
              <h1 class="font-display font-black text-2xl sm:text-3xl text-slate-900">🏆 Tes Trophées &amp; Progrès</h1>
              <p class="text-sm text-slate-500">Niveau actuel : <strong class="text-teal-700">${getLevelTitle(state.xp)}</strong> (${state.xp} XP)</p>
            </div>
            <div class="text-center bg-amber-50 border border-amber-200 px-5 py-3 rounded-2xl">
              <div class="font-display font-black text-2xl text-amber-700">${state.badges.length} / ${BADGES.length}</div>
              <div class="text-xs font-bold text-amber-900">Badges débloqués</div>
            </div>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
            ${BADGES.map(b => {
              const unlocked = state.badges.includes(b.id);
              return `
                <div class="rounded-2xl border-2 p-4 text-center transition ${unlocked ? 'bg-white border-amber-300 shadow-sm' : 'bg-slate-100 border-slate-200 opacity-60 grayscale'}">
                  <div class="text-4xl mb-2">${b.icon}</div>
                  <div class="font-display font-extrabold text-sm text-slate-900">${b.name}</div>
                  <div class="text-[11px] text-slate-500 mt-1">${b.desc}</div>
                  <div class="mt-2.5 text-[10px] font-black uppercase ${unlocked ? 'text-emerald-600' : 'text-slate-400'}">
                    ${unlocked ? '✅ Débloqué' : '🔒 Verrouillé'}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    /* =========================================================================
       10. VIEW 5: FINAL ADVENTURE ASSESSMENT ("Nhar kamel m3a 3a2ilti f lMaghrib")
       ========================================================================= */
    function restartFinalAdventure() {
      finalStepIndex = 0;
      finalResults = [];
      renderApp();
    }

    function renderFinalAdventureView() {
      // Completed Report Card
      if (finalStepIndex >= FINAL_ADVENTURE_STEPS.length) {
        const correctCount = finalResults.filter(r => r.correct).length;
        const total = FINAL_ADVENTURE_STEPS.length;
        const pct = Math.round((correctCount / total) * 100);
        const mastered = finalResults.filter(r => r.correct).map(r => r.skillTag);
        const toReview = finalResults.filter(r => !r.correct).map(r => r.skillTag);

        let message = "Tbarkellah 3lik ! Tu es prêt à passer une vraie journée au Maroc et à discuter avec toute ta famille !";
        if (pct < 60) message = "Super début ! Tu as déjà le courage de parler Darija. Révise les quelques points ci-dessous et retente le défi !";
        else if (pct < 85) message = "Bravo champion ! Ta famille va être super fière de t’entendre parler aussi bien !";

        return `
          <div class="fade-in max-w-2xl mx-auto bg-white rounded-3xl border-2 border-amber-300 p-6 sm:p-8 shadow-lg space-y-6">
            <div class="text-center space-y-2">
              <div class="text-6xl">${pct >= 70 ? '👑' : '🌟'}</div>
              <span class="text-xs font-black uppercase tracking-wider text-amber-700 bg-amber-100 px-3 py-1 rounded-full">Bilan de la Journée</span>
              <h1 class="font-display font-black text-2xl sm:text-3xl text-slate-900">Nhar kamel m3a 3a2ilti f lMaghrib</h1>
              <div class="font-display font-black text-4xl text-teal-700">${correctCount} / ${total} <span class="text-lg text-slate-400">(${pct}%)</span></div>
              <p class="text-sm text-slate-700 max-w-md mx-auto leading-relaxed">${message}</p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-4">
                <h3 class="font-display font-extrabold text-sm text-emerald-900 mb-2">✅ Compétences maîtrisées</h3>
                ${mastered.length ? `<ul class="text-xs text-emerald-800 space-y-1.5">${mastered.map(s => `<li>• ${s}</li>`).join('')}</ul>` : `<p class="text-xs text-emerald-700">Continue de pratiquer, ça arrive vite !</p>`}
              </div>
              <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4">
                <h3 class="font-display font-extrabold text-sm text-amber-900 mb-2">🧠 À renforcer</h3>
                ${toReview.length ? `<ul class="text-xs text-amber-800 space-y-1.5">${toReview.map(s => `<li>• ${s}</li>`).join('')}</ul>` : `<p class="text-xs text-amber-800 font-bold">Aucune erreur ! Score parfait ! 🔥</p>`}
              </div>
            </div>

            <div class="flex flex-wrap justify-center gap-3 pt-2">
              <button onclick="restartFinalAdventure()" class="btn-3d bg-teal-700 hover:bg-teal-600 text-white font-display font-black px-5 py-3 rounded-2xl text-sm">
                🔁 Rejouer le Défi Final
              </button>
              <button onclick="startReviewSession('smart')" class="bg-slate-100 hover:bg-slate-200 text-slate-800 font-display font-bold px-5 py-3 rounded-2xl text-sm">
                🧠 Réviser mes mots
              </button>
              <button onclick="navigateTo('home')" class="bg-slate-100 hover:bg-slate-200 text-slate-800 font-display font-bold px-5 py-3 rounded-2xl text-sm">
                🗺️ Carte
              </button>
            </div>
          </div>
        `;
      }

      const step = FINAL_ADVENTURE_STEPS[finalStepIndex];
      const pctBar = Math.round((finalStepIndex / FINAL_ADVENTURE_STEPS.length) * 100);

      return `
        <div class="fade-in max-w-2xl mx-auto space-y-5">
          <div class="flex items-center justify-between">
            <span class="text-xs font-black uppercase text-orange-600">🎯 Défi Final &bull; Scène ${finalStepIndex + 1} / ${FINAL_ADVENTURE_STEPS.length}</span>
            <button onclick="restartFinalAdventure()" class="text-xs font-bold text-slate-400 hover:text-slate-700">Recommencer</button>
          </div>

          <div class="h-2.5 bg-slate-200 rounded-full overflow-hidden">
            <div class="h-full bg-gradient-to-r from-orange-500 to-teal-600 transition-all duration-300" style="width: ${pctBar}%"></div>
          </div>

          <div class="bg-white rounded-3xl border border-slate-200 p-5 sm:p-7 shadow-md space-y-5">
            <div class="flex items-center gap-3">
              <span class="text-3xl">${step.icon}</span>
              <div>
                <div class="text-xs font-bold text-slate-400 uppercase">${step.stage}</div>
                <h2 class="font-display font-black text-lg text-slate-900">${step.character}</h2>
              </div>
            </div>

            <div class="bg-slate-900 text-white rounded-2xl p-4 space-y-1">
              <div class="flex items-center justify-between gap-2">
                <p class="font-display font-extrabold text-base sm:text-lg">« ${step.lineDarija} »</p>
                <button onclick="speakDarija('${escapeQuotes(step.lineDarija)}')" class="bg-white/15 hover:bg-white/25 px-2.5 py-1 rounded-lg text-xs shrink-0">🔊</button>
              </div>
              <p class="text-xs text-slate-300 italic">${step.lineFr}</p>
            </div>

            <p class="text-sm font-bold text-slate-800">${step.prompt}</p>

            ${step.type === 'choice' ? `
              <div class="space-y-2.5">
                ${step.options.map((opt, idx) => `
                  <button onclick="submitFinalChoice(${idx})" class="w-full text-left p-4 rounded-2xl border-2 border-slate-200 hover:border-teal-500 hover:bg-teal-50/40 font-display font-bold text-sm sm:text-base transition">
                    ${opt.text}
                  </button>
                `).join('')}
              </div>
            ` : `
              <div class="space-y-3">
                <textarea id="final-open-input" rows="2" placeholder="Écris ta réponse en Darija ici..." class="w-full rounded-2xl border-2 border-slate-200 focus:border-teal-500 focus:outline-none p-3.5 text-sm sm:text-base"></textarea>
                <button onclick="submitFinalOpen()" class="btn-3d bg-teal-700 hover:bg-teal-600 text-white font-display font-black px-6 py-3 rounded-2xl text-sm w-full sm:w-auto">
                  Envoyer ma réponse →
                </button>
              </div>
            `}
          </div>
        </div>
      `;
    }

    function submitFinalChoice(optIdx) {
      const step = FINAL_ADVENTURE_STEPS[finalStepIndex];
      const isCorrect = step.options[optIdx].correct;
      recordFinalStepResult(step, isCorrect);
    }

    function submitFinalOpen() {
      const step = FINAL_ADVENTURE_STEPS[finalStepIndex];
      const val = (document.getElementById('final-open-input')?.value || '').trim();
      if (!val) {
        showToast('Écris une petite réponse en Darija pour continuer !', 'info');
        return;
      }
      const norm = val.toLowerCase();
      const isCorrect = step.keywords.some(k => norm.includes(k)) && val.length >= 4;
      recordFinalStepResult(step, isCorrect, step.model);
    }

    function recordFinalStepResult(step, isCorrect, modelHint = '') {
      finalResults.push({ id: step.id, correct: isCorrect, skillTag: step.skillTag });
      if (isCorrect) {
        addXP(20, 'Réussi !');
        markMastered(step.vocabRef);
      } else {
        recordMistake(step.vocabRef);
        showToast(modelHint ? `Exemple : ${modelHint}` : 'Ajouté à tes révisions !', 'info');
      }

      finalStepIndex++;
      if (finalStepIndex >= FINAL_ADVENTURE_STEPS.length) {
        const score = finalResults.filter(r => r.correct).length;
        if (state.finalBestScore === null || score > state.finalBestScore) {
          state.finalBestScore = score;
        }
        if (score >= 5) unlockBadge('badge_champion');
        saveState();
      }
      renderApp();
    }

    /* =========================================================================
       11. UI HELPERS (TOASTS, CUSTOM MODAL, GUIDE, RESET)
       ========================================================================= */
    function escapeQuotes(str) {
      return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      const colors = {
        xp: 'bg-amber-500 text-white',
        badge: 'bg-teal-700 text-white',
        info: 'bg-slate-800 text-white'
      };
      el.className = `${colors[type] || colors.info} px-4 py-2.5 rounded-2xl shadow-lg text-xs sm:text-sm font-bold pop-in`;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.3s';
        setTimeout(() => el.remove(), 300);
      }, 2800);
    }

    function openModal(icon, title, body, actions = []) {
      document.getElementById('modal-icon').textContent = icon;
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = body;
      const actDiv = document.getElementById('modal-actions');
      actDiv.innerHTML = '';
      actions.forEach(a => {
        const btn = document.createElement('button');
        btn.className = a.secondary
          ? 'px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-bold'
          : 'btn-3d px-5 py-2.5 rounded-xl bg-teal-700 hover:bg-teal-600 text-white font-display font-black text-sm';
        btn.textContent = a.label;
        btn.onclick = a.fn;
        actDiv.appendChild(btn);
      });
      const modal = document.getElementById('custom-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      const modal = document.getElementById('custom-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function openTranscriptionGuide() {
      openModal(
        '📖',
        'Guide express : les chiffres en Darija',
        `En Darija écrite avec des lettres latines, certains chiffres remplacent des sons arabes :<br/><br/>
        <strong>3</strong> = son « a » profond (<em>3afak, l3a2ila, m3a</em>)<br/>
        <strong>7</strong> = « h » fort expiré (<em>Mer7ba, L7amdullah, s7abi</em>)<br/>
        <strong>9</strong> = « k » du fond de la gorge (<em>tri9, kat9ra, ne9der</em>)<br/>
        <strong>kh</strong> = comme la « j » espagnole (<em>khbarek, nekhrej</em>)<br/>
        <strong>ch</strong> = comme « ch » en français (<em>chokran, chnou</em>)`,
        [{ label: 'Compris ! 👍', fn: closeModal }]
      );
    }

    function confirmResetProgress() {
      openModal(
        '🔄',
        'Réinitialiser ta progression ?',
        'Tes points XP, badges et étapes terminées seront remis à zéro pour recommencer l’aventure depuis le début.',
        [
          { label: 'Annuler', secondary: true, fn: closeModal },
          {
            label: 'Oui, recommencer',
            fn: () => {
              state = { ...DEFAULT_STATE };
              dialogueSelections = {};
              quizAnswers = {};
              builderState = {};
              roleplayEvaluations = {};
              finalStepIndex = 0;
              finalResults = [];
              saveState();
              closeModal();
              navigateTo('home');
              showToast('Progression réinitialisée !', 'info');
            }
          }
        ]
      );
    }

    /* =========================================================================
       12. BOOTSTRAP APPLICATION
       ========================================================================= */
    window.addEventListener('DOMContentLoaded', () => {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.getVoices();
      }
      updateHUD();
      renderApp();
    });
  </script>
</body>
</html>
